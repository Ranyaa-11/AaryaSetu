{% extends 'layout.html' %}
{% block title %}Post Need{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto px-6 py-12">
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
    <h2 class="text-2xl font-bold text-gray-900 mb-1">Post a Need</h2>
    <p class="text-gray-500 text-sm mb-7">Let donors know what your institution needs.</p>

    <form method="POST">
      <div class="mb-5">
        <label class="block text-sm font-medium text-gray-700 mb-1">Item Name</label>
        <input type="text" name="item_name" required placeholder="e.g. Blankets, Stationery"
               class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-teal-300 focus:outline-none">
      </div>
      <div class="mb-5">
        <label class="block text-sm font-medium text-gray-700 mb-1">Description <span class="text-gray-400">(optional)</span></label>
        <textarea name="description" rows="3" placeholder="Specific requirements, sizes, age groups..."
                  class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-teal-300 focus:outline-none resize-none"></textarea>
      </div>
      <div class="mb-5">
        <label class="block text-sm font-medium text-gray-700 mb-1">Quantity</label>
        <input type="number" name="quantity" required min="1" placeholder="e.g. 25"
               class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-teal-300 focus:outline-none">
      </div>
      <div class="mb-7">
        <label class="block text-sm font-medium text-gray-700 mb-1">Urgency</label>
        <select name="urgency" required
                class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-teal-300 focus:outline-none bg-white">
          <option value="Low">🟢 Low</option>
          <option value="Medium">🟡 Medium</option>
          <option value="High">🟠 High</option>
          <option value="Urgent">🔴 Urgent</option>
        </select>
      </div>
      <button type="submit"
              class="w-full py-3 rounded-xl text-white font-semibold transition hover:scale-105"
              style="background:linear-gradient(135deg,#2d6a6a,#1a3a4a)">
        Post Need
      </button>
    </form>
  </div>
</div>
{% endblock %}
