{% extends 'layout.html' %}
{% block title %}Accept Item{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto mt-10 bg-white p-8 rounded-xl shadow-lg">
  <h2 class="text-3xl font-bold text-gray-700 mb-6">Accept This Donation</h2>
  
  <div class="bg-green-50 p-6 rounded-lg mb-6">
    <h3 class="text-xl font-semibold mb-2">{{ item.item_name }}</h3>
    <p><strong>Quantity Available:</strong> {{ item.quantity }}</p>
  </div>

  <form method="POST">
    <div class="mb-6">
      <label class="block text-gray-600 mb-2">Pickup/Delivery Preference</label>
      <select name="delivery_method" required
              class="w-full border rounded px-3 py-2 focus:ring focus:ring-green-400">
        <option value="pickup">We will pick up</option>
        <option value="donor-delivery">Donor can deliver</option>
        <option value="volunteer">Request volunteer help</option>
      </select>
    </div>

    <button type="submit" 
            class="w-full bg-gradient-to-r from-green-600 to-teal-600 text-white py-3 rounded-lg hover:scale-105 transition transform">
      Accept Item
    </button>
  </form>
</div>
{% endblock %}
