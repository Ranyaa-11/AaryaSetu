{% extends 'layout.html' %}
{% block title %}Post Item{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto px-6 py-12">
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
    <h2 class="text-2xl font-bold text-gray-900 mb-1">Post a Donation</h2>
    <p class="text-gray-500 text-sm mb-7">Tell institutions what you'd like to donate.</p>

    <form method="POST">
      <div class="mb-5">
        <label class="block text-sm font-medium text-gray-700 mb-1">Item Name</label>
        <input type="text" name="item_name" required placeholder="e.g. Winter clothes, Notebooks"
               class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-amber-300 focus:outline-none">
      </div>
      <div class="mb-5">
        <label class="block text-sm font-medium text-gray-700 mb-1">Description <span class="text-gray-400">(optional)</span></label>
        <textarea name="description" rows="3" placeholder="Condition, size, any relevant details..."
                  class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-amber-300 focus:outline-none resize-none"></textarea>
      </div>
      <div class="mb-7">
        <label class="block text-sm font-medium text-gray-700 mb-1">Quantity</label>
        <input type="number" name="quantity" required min="1" placeholder="e.g. 10"
               class="w-full border border-gray-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-amber-300 focus:outline-none">
      </div>
      <button type="submit"
              class="w-full py-3 rounded-xl text-white font-semibold transition hover:scale-105"
              style="background:linear-gradient(135deg,#f4a261,#e76f51)">
        Post Item
      </button>
    </form>
  </div>
</div>
{% endblock %}
