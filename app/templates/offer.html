{% extends 'layout.html' %}
{% block title %}Offer to Fulfill Need{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto mt-10 bg-white p-8 rounded-xl shadow-lg">
  <h2 class="text-3xl font-bold text-gray-700 mb-6">Confirm Your Offer</h2>
  
  <div class="bg-indigo-50 p-6 rounded-lg mb-6">
    <h3 class="text-xl font-semibold mb-2">{{ need.item_name }}</h3>
    <p><strong>Quantity Needed:</strong> {{ need.quantity }}</p>
    <p><strong>Urgency:</strong> {{ need.urgency }}</p>
  </div>

  <form method="POST">
    <div class="mb-6">
      <label class="block text-gray-600 mb-2">Delivery Method</label>
      <select name="delivery_method" required
              class="w-full border rounded px-3 py-2 focus:ring focus:ring-indigo-400">
        <option value="self-delivery">I will deliver myself</option>
        <option value="pickup">Institution can pick up</option>
        <option value="volunteer">Request volunteer help</option>
      </select>
    </div>

    <button type="submit" 
            class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-3 rounded-lg hover:scale-105 transition transform">
      Confirm Offer
    </button>
  </form>
</div>
{% endblock %}
